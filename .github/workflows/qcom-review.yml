name: QCOM review validation
on:
  pull_request:
    branches:
      - codex-ci/qcom-msm-linux618
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply reviewed changes
        run: |
          PATCH_B64=$(sed -n '/PATCH_B64: >-/{n;s/^[[:space:]]*//;p;q}' .github/workflows/docs.yml)
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/qcom_review_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/qcom_review_apply.py')
          source = path.read_text()
          old = '''for line, label in [
            ("    self._add_buffers(signal.base_buf)\\n", "signal buffer tracking"),
            ("    self._add_buffers(signal.base_buf)\\n", "timestamp buffer tracking"),
            ("    self._add_buffers(signal.base_buf)\\n", "wait buffer tracking"),
          ]:
            ops = replace_once(ops, line, "", label)
          '''
          new = '''if ops.count("    self._add_buffers(signal.base_buf)\\n") != 3:
            raise RuntimeError("expected three signal buffer tracking lines")
          ops = ops.replace("    self._add_buffers(signal.base_buf)\\n", "")
          '''
          if old not in source: raise RuntimeError('signal tracking transform was not found')
          source = source.replace(old, new)
          old = '''ops = replace_once(ops,
          """    if self.allocations.get(allocation.handle) is not allocation: raise RuntimeError(f"MSM GEM handle {allocation.handle} is already freed")
          """,
          """    if allocation.freed: raise RuntimeError(f"MSM GEM handle {allocation.handle} is already freed")
          """, "free liveness")
          '''
          new = '''free_liveness = "    if self.allocations.get(allocation.handle) is not allocation: raise RuntimeError(f\\"MSM GEM handle {allocation.handle} is already freed\\")\\n"
          if ops.count(free_liveness) != 2: raise RuntimeError(f"free liveness: expected two matches, found {ops.count(free_liveness)}")
          ops = ops.replace(free_liveness, "    if allocation.freed: raise RuntimeError(f\\"MSM GEM handle {allocation.handle} is already freed\\")\\n", 1)
          '''
          if old not in source: raise RuntimeError('free liveness transform was not found')
          path.write_text(source.replace(old, new))
          PY
          python /tmp/qcom_review_apply.py
      - name: Normalize reviewed source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tinygrad/runtime/ops_qcom.py')
          source = path.read_text()
          replacements = {
            '  fd.__del__(); hasattr(fd, "fd") and delattr(fd, "fd")\n': '  fd.__del__()\n  if hasattr(fd, "fd"): delattr(fd, "fd")\n',
            '    if bytes(name[:version.name_len]) != b"msm": _close_msm_file(fd); return None\n': '    if bytes(name[:version.name_len]) != b"msm":\n      _close_msm_file(fd)\n      return None\n',
            '      except OSError as e: errors.append(f"{path}: {e}"); continue\n': '      except OSError as e:\n        errors.append(f"{path}: {e}")\n        continue\n',
            '      if gpu_id != (6, 3, 0): errors.append(f"{path}: unsupported chip_id={chip_id:#x}"); _close_msm_file(fd); continue\n': '      if gpu_id != (6, 3, 0):\n        errors.append(f"{path}: unsupported chip_id={chip_id:#x}")\n        _close_msm_file(fd)\n        continue\n',
            '      self.fd, self.chip_id, self.gpu_id = fd, chip_id, gpu_id; break\n': '      self.fd, self.chip_id, self.gpu_id = fd, chip_id, gpu_id\n      break\n',
            '    else: raise RuntimeError("No supported MSM DRM A630 render node found" + (f" ({\'; \'.join(errors)})" if errors else ""))\n': '    else:\n      raise RuntimeError("No supported MSM DRM A630 render node found" + (f" ({\'; \'.join(errors)})" if errors else ""))\n',
          }
          for old, new in replacements.items():
            if source.count(old) != 1: raise RuntimeError(f'normalization expected one match: {old!r}')
            source = source.replace(old, new)
          path.write_text(source)
          PY
      - name: Install host test tools
        run: python -m pip install -e . pytest ruff mypy
      - name: Run host validation
        run: |
          python -m pytest test/device/test_qcom.py::TestMSMDRMUAPI test/device/test_qcom.py::TestQCOMKernelInterfaces
          DEV=CPU python - <<'PY'
          from tinygrad import Tensor
          assert (Tensor([1, 2, 3]) + Tensor([4, 5, 6])).tolist() == [5, 7, 9]
          PY
          python -m ruff check tinygrad/runtime/ops_qcom.py test/device/test_qcom.py
          python -m mypy tinygrad/runtime/ops_qcom.py
          python -m compileall -q tinygrad/runtime/ops_qcom.py test/device/test_qcom.py
          python -c "from tinygrad.runtime.autogen import msm_drm; from tinygrad.runtime import ops_qcom"
          MAX_LINE_COUNT=25000 python sz.py
          git diff --check
      - name: Commit clean branch result
        env:
          BASE_SHA: e5f18fefa7d9cdccf1b4117c0db46ba4820b505a
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: codex-review/qcom-msm-linux618
        run: |
          mkdir -p /tmp/qcom-final/tinygrad/runtime /tmp/qcom-final/test/device
          cp tinygrad/runtime/ops_qcom.py /tmp/qcom-final/tinygrad/runtime/
          cp test/device/test_qcom.py /tmp/qcom-final/test/device/
          git reset --hard "$BASE_SHA"
          git clean -fd
          cp /tmp/qcom-final/tinygrad/runtime/ops_qcom.py tinygrad/runtime/ops_qcom.py
          cp /tmp/qcom-final/test/device/test_qcom.py test/device/test_qcom.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tinygrad/runtime/ops_qcom.py test/device/test_qcom.py
          git diff --cached --check
          git commit -m "qcom: simplify MSM DRM interface for Linux 6.18"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$HEAD_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
